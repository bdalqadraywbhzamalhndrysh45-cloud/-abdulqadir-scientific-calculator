<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="description" content="آلة حاسبة علمية من عبد القادر، تعمل دون اتصال بعد أول زيارة.">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css"><title>آلة عبد القادر العلمية</title>
</head>
<body>
<main class="app">
<header><div class="brand"><span class="mark">∑</span><div><h1>عبد القادر</h1><p>الآلة الحاسبة العلمية</p></div></div><button id="angle" class="mode" aria-label="تغيير وحدة الزاوية">DEG</button></header>
<section class="calculator" aria-label="الآلة الحاسبة">
<div class="screen"><div id="history" class="history" aria-live="polite"></div><div id="display" class="display" aria-live="polite">0</div></div>
<div class="keys">
<button class="fn" data-action="clear">AC</button><button class="fn" data-action="delete">DEL</button><button class="fn" data-value="(">(</button><button class="fn" data-value=")">)</button><button class="op" data-value="÷">÷</button>
<button class="fn" data-value="sin(">sin</button><button class="fn" data-value="cos(">cos</button><button class="fn" data-value="tan(">tan</button><button class="fn" data-value="√(">√</button><button class="op" data-value="×">×</button>
<button class="fn" data-value="ln(">ln</button><button class="fn" data-value="log(">log</button><button class="fn" data-value="π">π</button><button class="fn" data-value="^">xʸ</button><button class="op" data-value="−">−</button>
<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="fn" data-value="%">%</button><button class="op" data-value="+">+</button>
<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="fn" data-value="!">x!</button><button class="op" data-value="÷">÷</button>
<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="fn" data-value="e">e</button><button class="op" data-value="×">×</button>
<button class="wide" data-value="0">0</button><button data-value=".">.</button><button class="equal" data-action="equals">=</button>
</div>
</section>
<footer><span>صُممت بعناية</span><span class="watermark">عبد القادر</span><span>تعمل دون إنترنت</span></footer>
</main><script src="/app.js" defer></script>
</body></html>
